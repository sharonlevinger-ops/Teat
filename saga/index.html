<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Forest Pinball Saga</title>
  <meta name="theme-color" content="#05070a">
  <meta name="app-version" content="1.5.1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pinball Saga">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/cinzel-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stage" aria-label="Forest Pinball Saga table"></canvas>
  <div id="table-layer" class="hud-layer"></div>
  <div id="hud-layer" class="hud-layer"></div>
  <button id="calib-toggle" class="calib-toggle hidden" aria-pressed="false">Calibration</button>
  <section id="pause" class="pause overlay hidden" role="dialog" aria-modal="true" aria-label="Paused">
    <div class="card">
      <h2>Paused</h2>
      <button id="btn-resume" class="gold-btn">Resume</button>
      <div class="btn-row">
        <button id="btn-newgame" class="gold-btn ghost">New game</button>
        <button id="btn-journal" class="gold-btn ghost">Journal</button>
      </div>
      <div class="btn-row">
        <button id="btn-help" class="gold-btn ghost small">How to play</button>
        <button id="btn-voice" class="gold-btn ghost small" aria-pressed="true">Voice: On</button>
      </div>
      <ul class="controls" aria-label="Controls">
        <li><b>Tap left / right</b><span>Flippers</span></li>
        <li><b>Pull down bottom right</b><span>Launch (further = harder)</span></li>
        <li><b>Swipe up</b><span>Nudge the table (careful: TILT)</span></li>
      </ul>
      <button id="btn-report" class="gold-btn ghost small link-btn">Report a problem</button>
    </div>
  </section>
  <script type="module" src="js/main.js"></script>
</body>
</html>
