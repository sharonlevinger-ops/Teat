<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>יומן 2.0</title>
  <meta name="description" content="יומן, משימות, מסמכים וסיסמאות – אפליקציה אישית ופרטית לאייפון">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="color-scheme" content="light dark">

  <!-- iOS home-screen app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="יומן 2.0">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="css/app.css">
  <script>
    // apply theme before first paint to avoid a flash
    try {
      var t = localStorage.getItem('yoman2.theme') || 'light';
      if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>יש לאפשר JavaScript כדי להשתמש ביומן 2.0</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
